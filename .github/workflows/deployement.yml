name: Deploy to Render

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This deployment job runs after CI tests are successful if needed, or standalone.
    # To run only after the CI 'test' job succeeds, you can integrate this into a single pipeline or keep them separate.
    steps:
      - name: Trigger Render Deploy Hook
        # Requires adding RENDER_DEPLOY_HOOK_URL to your GitHub repository secrets
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
